<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">

      <h2 class="text-center mb-4">Student List</h2>

      <table class="table table-bordered table-hover text-center">
        <thead class="table-dark">
            <tr>
              <th>Student ID</th>
              <th>Username</th>
              <th>Grade</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for student in students %}
            <tr>
              <td>{{ student.id }}</td>
              <td>{{ student.username }}</td>
              <td>{{ student.grade }}</td>

              <td>
                {% comment %} <a href="{% url 'student_list' student.pk %}">View</a> | {% endcomment %}
                <a href="{% url 'student_edit' student.pk %}" class="btn btn-sm btn-warning me-2">Edit</a> 
                <a href="{% url 'student_delete' student.pk %}" class="btn btn-sm btn-danger">Delete</a>
              </td>
            </tr>
            {% empty %}
            <tr><td colspan="4">No students found.</td></tr>
            {% endfor %}
          </tbody>
        </table>
        <a href="{% url 'student_add' %}">Add New Student</a>
      </div>
    </div>
  </div>
</div>
