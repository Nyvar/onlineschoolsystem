<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">

      <h2 class="text-center mb-4">Categories List</h2>

      <table class="table table-bordered table-hover text-center">
        <thead class="table-dark">
          <tr>
            <th>category ID</th>
            <th>Name</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for categories in categories %}
          <tr>
            <td>{{ categories.id }}</td>
            <td>{{ categories.name }}</td>
            <td>
              <a href="{% url 'category_edit' categories.pk %}" class="btn btn-sm btn-warning me-2">Edit</a> 
              <a href="{% url 'category_delete' categories.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="4">No category found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
        <div class="text-center mt-4">
          <a href="{% url 'category_add' %}" class="btn btn-success">Add New category</a>
      </div>
    </div>
