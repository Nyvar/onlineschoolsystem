<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">

      <h2 class="text-center mb-4">enrollment List</h2>

      <table class="table table-bordered table-hover text-center">
        <thead class="table-dark">
          <tr>
            <th>Course</th>
            <th>Student</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for enrollment in enrollments %}
          <tr>
            <td>{{ enrollment.course.title }}</td>
            <td>{{ enrollment.student.username }}</td>
            <td>
              <a href="{% url 'enrollment_edit' enrollment.pk %}" class="btn btn-sm btn-warning me-2">Edit</a> 
              <a href="{% url 'enrollment_delete' enrollment.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
          </tr>
          {% empty %}
          <tr><td colspan="4">No enrollments found.</td></tr>
          {% endfor %}
        </tbody>
      </table>
      <div class="text-center mt-4">
        <a href="{% url 'enrollment_add' %}" class="btn btn-success">Add New enrollment</a>
      </div>

    </div>
  </div>
</div>
