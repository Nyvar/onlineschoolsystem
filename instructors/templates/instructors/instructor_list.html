<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">

      <h2 class="text-center mb-4">Instructor List</h2>

      <table class="table table-bordered table-hover text-center">
        <thead class="table-dark">
            <tr>
              <th>Instructor ID</th>
              <th>Name</th>
              <th>Salary</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            {% for instructor in instructors %}
            <tr>
              <td>{{ instructor.id }}</td>
              <td>{{ instructor.username }}</td>
              <td>{{ instructor.salary }}</td>
              <td>
                <a href="{% url 'instructor_edit' instructor.pk %}" class="btn btn-sm btn-warning me-2">Edit</a> 
                <a href="{% url 'instructor_delete' instructor.pk %}" class="btn btn-sm btn-danger">Delete</a>
              </td>
            </tr>
            {% empty %}
            <tr><td colspan="4">No instructors found.</td></tr>
            {% endfor %}
          </tbody>
        </table>
        <a href="{% url 'instructor_add' %}">Add New instructor</a>
      </div>

    </div>
  </div>
</div>
