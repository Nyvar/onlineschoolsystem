{% extends "base.html" %}
{% load static %}
{% block title %}Employee_Dashboard{% endblock title %}
{% block content %}
<div class="container-fluid">
  <div class="row min-vh-100">
    <nav class="col-md-3 col-lg-2 d-md-block bg-dark sidebar text-white p-4">
      <div class="sidebar-sticky">
        <h4 class="text-center mb-4">Dashboard</h4>
          <ul class="nav flex-column">
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('em_sum')">keepUp</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('enrollment_list')">Enrollment</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('category_list')">Categories</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('course_list')">Course</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('lesson_list')">Lesson</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('assignment_list')">Assignment</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('student_list')">Student</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('instructor_list')">instructor</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('employee_list')">employee</a>
            </li>
            <li class="nav-item">
              <a href="#" class="nav-link text-white" onclick="loadPage('tag_list')">Tag</a>
            </li>
          </ul>
        <div class="mt-4 text-center">
          <button class="btn btn-outline-light w-100" onclick="window.location.href='{% url 'logout' %}'">Logout</button>
        </div>
      </div>
    </nav>

    <div class="col-md-9 col-lg-10 bg-light p-5 " id="main-content">
    </div>

  </div>
</div>


<script>
  document.addEventListener("DOMContentLoaded", function () {
    loadPage('em_sum'); 
  });
</script>


<script>
  function loadPage(pageName) {
    //alert("halooo")
    fetch(`/employees/load/${pageName}/`)
    .then(response => response.text())
    .then(html => {
    document.getElementById('main-content').innerHTML = html;
    })
    .catch(error => {
    console.error('Error loading page:', error);
    });
}
</script>

{% endblock content %}
