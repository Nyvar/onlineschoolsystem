<div class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-10 col-lg-8">

      <h2 class="text-center mb-4">Lesson List</h2>

      <table class="table table-bordered table-hover text-center">
        <thead class="table-dark">
          <tr>
            <th>Lesson Name</th>
            <th>Course</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          {% for lesson in lessons %}
          <tr>
            <td class="text-start">{{ lesson.title }}</td>
            <td>{{ lesson.course }}</td>
            <td>{{ lesson.description }}</td>
            <td>
              <a href="{% url 'lesson_edit' lesson.pk %}" class="btn btn-sm btn-warning me-2">Edit</a>
              <a href="{% url 'lesson_delete' lesson.pk %}" class="btn btn-sm btn-danger">Delete</a>
            </td>
          </tr>
          {% empty %}
          <tr>
            <td colspan="4">No lessons found.</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <div class="text-center mt-4">
        <a href="{% url 'lesson_add' %}" class="btn btn-success">➕ Add New Lesson</a>
      </div>

    </div>
  </div>
</div>
