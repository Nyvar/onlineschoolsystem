{% extends "base.html" %}
{% block content %}

<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h2 class="mb-0">{% if form.instance.pk %}Add{% else %}Create{% endif %} Assignment</h2>
    </div>
    <div class="card-body " >
      <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <div class="d-flex justify-content-between mt-4">
          <button type="submit" class="btn btn-success">Save</button>
          <button onclick="history.back()" class="btn btn-outline-secondary">Cancle</button>
        </div>
        
      </form>
      
    </div>
  </div>
</div>
{% endblock content %}
