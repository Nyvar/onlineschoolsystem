{% comment %} {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
    <style>
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            transition: 0.3s;
        }
        .card:hover {
            transform: scale(1.02);
        }
        .dashboard-container {
            padding: 40px;
        }
    </style>
</head>
<body> {% endcomment %}
<div class="container dashboard-container">
    <h2 class="mb-4">📊 Employee Dashboard</h2>
    <div class="row g-4">
        <div class="col-md-3">
            <div class="card text-white bg-primary">
                <div class="card-body">
                    <h5 class="card-title">Total Employees</h5>
                    <p class="card-text fs-4">{{ total_employees }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-success">
                <div class="card-body">
                    <h5 class="card-title">Total all Students</h5>
                    <p class="card-text fs-4">{{ total_students }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-warning">
                <div class="card-body">
                    <h5 class="card-title">Total Instructors</h5>
                    <p class="card-text fs-4">{{ total_instructors }}</p>
                </div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card text-white bg-danger">
                <div class="card-body">
                    <h5 class="card-title">Total all Courses</h5>
                    <p class="card-text fs-4">{{ total_courses }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% comment %} <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html> {% endcomment %}
